services:
  postgres:
    image: postgres:16-alpine
    container_name: huecas-postgres
    environment:
      POSTGRES_DB: las_huecas_esmeraldas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d las_huecas_esmeraldas"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: huecas-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/las_huecas_esmeraldas
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: huecas-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
