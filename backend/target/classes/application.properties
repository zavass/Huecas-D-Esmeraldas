# ==========================================================
# LAS HUECAS DE ESMERALDAS
# Configuracion principal del Backend
# ==========================================================

spring.application.name=las-huecas-de-esmeraldas

# ==========================================================
# SERVIDOR
# ==========================================================

server.port=8080


# ==========================================================
# POSTGRESQL
# ==========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/las_huecas_esmeraldas
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false


# ==========================================================
# JSON
# ==========================================================

spring.jackson.serialization.fail-on-empty-beans=false


# ==========================================================
# CORS
# ==========================================================

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000


# ==========================================================
# JWT
# ==========================================================

app.jwt.secret=LasHuecasDeEsmeraldasJWTClaveSegura2026SistemaTuristicoGastronomico

app.jwt.expiration=86400000


# ==========================================================
# LOG
# ==========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG