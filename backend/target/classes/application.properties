# ==========================================================
# LAS HUECAS DE ESMERALDAS - CONFIGURACION LOCAL
# ==========================================================
spring.application.name=las-huecas-de-esmeraldas
server.port=8080

# POSTGRESQL - Solo desarrollo local
spring.datasource.url=jdbc:postgresql://localhost:5432/las_huecas_esmeraldas
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JSON
spring.jackson.serialization.fail-on-empty-beans=false

# CORS - No utilizar '*' con allowCredentials=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# JWT - Clave de desarrollo existente (rotar y externalizar antes de publicar)
app.jwt.secret=LasHuecasDeEsmeraldasJWTClaveSegura2026SistemaTuristicoGastronomico
app.jwt.expiration=86400000

# LOGS
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# NOTICIAS - Busqueda automatica cuatro veces al dia en Ecuador
noticias.habilitadas=true
noticias.publicar-automaticamente=true
noticias.cron=0 0 7,12,18,22 * * *

# IMAGENES - Procesar hasta 12 pendientes por ronda.
# Nueva ronda 10 minutos despues de terminar la anterior.
# El servicio evita reintentar la misma noticia durante 6 horas.
noticias.imagenes.habilitadas=true
noticias.imagenes.max-por-ronda=12
noticias.imagenes.espera-inicial-ms=20000
noticias.imagenes.intervalo-ms=600000
